<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manual de Usuario - GECRAI 1.1</title>
    <style>
        :root {
            --bg-body: #f8fafc;
            --bg-surface: #ffffff;
            --border-subtle: #e5e7eb;
            --text-primary: #0a0f1c;
            --text-secondary: #374151;
            --text-muted: #6b7280;
            --accent: #0066ff;
            --accent-soft: #eef2ff;
            --accent-border: #c7d2fe;

            --bg-body: #0b1220;
            --bg-surface: #0e1726;
            --border-subtle: rgba(0,224,255,0.12);
            --text-primary: #e6f7ff;
            --text-secondary: #bce6ff;
            --text-muted: #7fb6d6;
            --accent: #00e0ff;
            --accent-soft: rgba(0,224,255,0.12);
            --accent-border: rgba(0,224,255,0.35);
        }

        body.light-theme {
            --bg-body: #f8fafc;
            --bg-surface: #ffffff;
            --border-subtle: #e5e7eb;
            --text-primary: #0a0f1c;
            --text-secondary: #374151;
            --text-muted: #6b7280;
            --accent: #0066ff;
            --accent-soft: #eef2ff;
            --accent-border: #c7d2fe;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-secondary);
            background: var(--bg-body);
            line-height: 1.65;
        }
        .wrap {
            max-width: 1100px;
            margin: 0 auto;
            padding: 24px;
        }
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
            padding: 24px 0;
            border-bottom: 1px solid var(--border-subtle);
            margin-bottom: 24px;
        }
        .title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.6rem;
            color: var(--text-primary);
        }
        .actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .pill {
            padding: 8px 14px;
            background: var(--accent-soft);
            color: var(--accent);
            border-radius: 999px;
            font-weight: 700;
            font-size: .9rem;
            border: 1px solid var(--accent-border);
        }
        .layout {
            display: grid;
            grid-template-columns: 250px 1fr;
            gap: 24px;
        }
        .toc {
            position: sticky;
            top: 16px;
            height: fit-content;
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 14px;
            padding: 18px;
        }
        .toc h4 {
            font-size: .95rem;
            color: var(--text-primary);
            margin-bottom: 12px;
        }
        .toc a {
            display: block;
            padding: 8px 10px;
            color: var(--text-secondary);
            text-decoration: none;
            border-radius: 8px;
            margin-bottom: 4px;
            font-weight: 600;
        }
        .toc a:hover {
            background: var(--accent-soft);
            color: var(--accent);
        }
        .toc a.active {
            background: var(--accent-soft);
            color: var(--accent);
            border-left: 3px solid var(--accent);
        }
        .doc {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 14px;
            padding: 22px;
        }
        .doc h2 {
            color: var(--text-primary);
            margin-top: 28px;
            margin-bottom: 10px;
            font-size: 1.25rem;
        }
        .doc h3 {
            color: var(--text-primary);
            margin-top: 18px;
            margin-bottom: 8px;
            font-size: 1.05rem;
        }
        .doc p, .doc li {
            color: var(--text-secondary);
            margin-bottom: 10px;
        }
        .doc ul {
            padding-left: 22px;
            margin-bottom: 14px;
        }
        .doc li { margin-bottom: 8px; }
        .note {
            background: var(--accent-soft);
            border-left: 4px solid var(--accent);
            padding: 12px 14px;
            border-radius: 8px;
            margin: 14px 0;
        }
        .grid {
            display: grid;
            gap: 14px;
        }
        .grid-2 { grid-template-columns: repeat(2, 1fr); }
        .grid-3 { grid-template-columns: repeat(3, 1fr); }
        .card {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
            padding: 14px;
        }
        .card h4 {
            color: var(--text-primary);
            margin-bottom: 8px;
            font-size: .95rem;
        }
        .steps {
            counter-reset: step;
            list-style: none;
            padding-left: 0;
        }
        .steps li {
            counter-increment: step;
            padding-left: 38px;
            position: relative;
            margin-bottom: 14px;
        }
        .steps li::before {
            content: counter(step);
            position: absolute;
            left: 0;
            top: 0;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: linear-gradient(135deg,var(--accent),var(--accent-border));
            color: #fff;
            font-weight: 700;
            font-size: .85rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        #search {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
            margin-bottom: 16px;
            background: var(--bg-surface);
            color: var(--text-primary);
        }
        .hidden { display: none; }
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
            padding: 16px 0;
            border-bottom: 1px solid var(--border-subtle);
            margin-bottom: 16px;
            position: sticky;
            top: 0;
            background: var(--bg-surface);
            z-index: 5;
        }
        .topbar a {
            color: var(--accent);
            font-weight: 700;
            text-decoration: none;
        }
        .theme-toggle {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            background: linear-gradient(135deg, var(--accent), var(--accent-border));
            color: #0a0f1c;
            transition: transform .2s ease, box-shadow .2s ease;
        }
        .theme-toggle:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 25px rgba(0,224,255,0.35);
        }

        details {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 10px;
        }
        summary {
            font-weight: 700;
            color: var(--text-primary);
            cursor: pointer;
            list-style: none;
        }
        summary::after {
            content: ' ▸';
            color: var(--accent);
        }
        details[open] summary::after {
            content: ' ▾';
        }
        details p {
            color: var(--text-secondary);
            margin-top: 8px;
        }

        @media print {
            body, .wrap, header, .topbar, .toc, .doc, .card, details, summary {
                background: #fff !important;
                color: #000 !important;
                border-color: #e5e7eb !important;
            }
            body * { visibility: hidden; }
            #inicio, #inicio * { visibility: visible; }
            #inicio {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                padding: 40px;
                background: #fff;
                color: #000;
            }
            .theme-toggle, .topbar, .toc, #search, .no-print {
                display: none !important;
            }
        }
        @media (max-width: 900px) {
            .layout { grid-template-columns: 1fr; }
            .toc { position: static; }
            .grid-2, .grid-3 { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <header>
            <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:20px;">
                <div>
                    <div class="title">GECRAI 1.1</div>
                    <p style="color:var(--text-muted);margin-top:4px;">Manual de usuario y documentación interactiva</p>
                </div>
                <div style="display:flex;gap:10px;align-items:center;">
                    <button id="themeToggle" class="theme-toggle">Tema</button>
                </div>
            </div>
        </header>

        <div class="topbar">
            <input id="search" type="text" placeholder="Buscar en la documentación...">
            <a href="#inicio">Volver arriba</a>
        </div>

        <div class="layout">
            <aside class="toc" id="toc">
                <h4>Contenido</h4>
            </aside>

            <article class="doc" id="inicio">
                <div id="docLoader" style="color:var(--text-muted);">Cargando documentación...</div>
            </article>
            <div id="noResults" class="note hidden">No se encontraron resultados para tu búsqueda.</div>
        </div>
    </div>

    <script type="module">
        import { buildDocSections, buildToc } from './data.js';

        const search = document.getElementById('search');
        const noResults = document.getElementById('noResults');
        const tocLinks = () => Array.from(document.querySelectorAll('#toc a'));

        buildDocSections();
        buildToc();

        document.getElementById('themeToggle')?.addEventListener('click', () => {
            const isLight = document.body.classList.toggle('light-theme');
            localStorage.setItem('docs-theme', isLight ? 'light' : 'dark');
            updateThemeLabel(isLight);
        });

        function updateThemeLabel(isLight) {
            const btn = document.getElementById('themeToggle');
            if (!btn) return;
            btn.textContent = isLight ? 'Tema claro' : 'Tema oscuro';
        }

        const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const savedTheme = localStorage.getItem('docs-theme');
        if (savedTheme === 'light') {
            document.body.classList.add('light-theme');
            updateThemeLabel(true);
        } else if (savedTheme === 'dark') {
            document.body.classList.remove('light-theme');
            updateThemeLabel(false);
        } else if (!systemPrefersDark) {
            document.body.classList.add('light-theme');
            updateThemeLabel(true);
        } else {
            updateThemeLabel(false);
        }

        function filterDoc(query) {
            const q = (query || '').trim().toLowerCase();
            const sections = document.querySelectorAll('.doc-section');
            let visibleCount = 0;

            sections.forEach((section) => {
                const match = !q || (section.dataset.search || '').includes(q);
                section.style.display = match ? '' : 'none';
                if (match) visibleCount++;
            });

            if (noResults) noResults.classList.toggle('hidden', visibleCount > 0);
        }

        search?.addEventListener('input', (e) => {
            filterDoc(e.target.value);
        });

        function initScrollspy() {
            const links = tocLinks();
            if (!links.length || !('IntersectionObserver' in window)) return;

            const observer = new IntersectionObserver((entries) => {
                entries.forEach((entry) => {
                    if (!entry.isIntersecting) return;
                    links.forEach((link) => {
                        link.classList.toggle('active', link.dataset.target === entry.target.id);
                    });
                });
            }, { rootMargin: '-20% 0px -70% 0px', threshold: 0 });

            document.querySelectorAll('.doc-section').forEach((section) => observer.observe(section));
        }

        initScrollspy();
    </script>
</body>
</html>
