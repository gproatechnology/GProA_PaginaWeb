<svg class="proyecto-svg" viewBox="0 0 500 360" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Filtros de resplandor espacial y juego -->
    <filter id="saiyddGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlowSaiydd" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Degradados temáticos de Gaming y EdTech -->
    <linearGradient id="gameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#00e0ff" />
      <stop offset="100%" stop-color="#0066ff" />
    </linearGradient>

    <!-- Caras del cubo isométrico principal (Luz cenital) -->
    <linearGradient id="cubeTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e0ff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="cubeLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="cubeRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#0a0f1d" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <radialGradient id="gamingAura" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#00e0ff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Aura espacial de videojuego -->
  <circle cx="250" cy="155" r="150" fill="url(#gamingAura)" />

  <!-- Cuadrícula isométrica 3D (Roblox World Coordinates) -->
  <g stroke="rgba(0, 224, 255, 0.12)" stroke-width="1" fill="none">
    <!-- Líneas del plano de tierra isométrico -->
    <line x1="250" y1="260" x2="100" y2="175" />
    <line x1="250" y1="260" x2="400" y2="175" />
    <line x1="250" y1="260" x2="250" y2="30" stroke-dasharray="3 4" />
    
    <line x1="175" y1="217" x2="325" y2="132" stroke-dasharray="2 4" />
    <line x1="325" y1="217" x2="175" y2="132" stroke-dasharray="2 4" />

    <!-- Ejes coordenados X, Y, Z -->
    <path d="M 60,60 L 75,60 M 60,60 L 60,75" />
    <path d="M 440,60 L 425,60 M 440,60 L 440,75" />
  </g>

  <!-- BIRRETE ACADÉMICO TECNOLÓGICO (EdTech Superior) -->
  <g transform="translate(250, 68)" filter="url(#softGlowSaiydd)">
    <!-- Diamante superior del birrete -->
    <polygon points="0,-18 42,0 0,18 -42,0" fill="#0b1329" stroke="url(#gameGrad)" stroke-width="2" />
    <!-- Borde interior luminoso -->
    <polygon points="0,-10 26,0 0,10 -26,0" fill="none" stroke="#00e0ff" stroke-width="1" opacity="0.6" />
    <!-- Botón central y borla dorada de graduación -->
    <circle cx="0" cy="0" r="3.5" fill="#fbbf24" />
    <path d="M 0,0 C 12,4 24,12 28,26" fill="none" stroke="#fbbf24" stroke-width="1.8" stroke-linecap="round" />
    <circle cx="28" cy="27" r="2.5" fill="#fbbf24" filter="url(#softGlowSaiydd)" />
  </g>

  <!-- BLOQUE ISOMÉTRICO CENTRAL 3D (Roblox Voxel Core) -->
  <g transform="translate(250, 160)" filter="url(#saiyddGlow)">
    <!-- Cara Superior (Top) -->
    <polygon points="0,-48 55,-16 0,16 -55,-16" fill="url(#cubeTop)" />
    <!-- Detalle superior: Núcleo girado característico de Roblox -->
    <polygon points="0,-32 20,-20 0,-8 -20,-20" fill="#0b172a" stroke="#ffffff" stroke-width="1.2" opacity="0.8" />

    <!-- Cara Izquierda (Left) -->
    <polygon points="-55,-16 0,16 0,78 -55,46" fill="url(#cubeLeft)" stroke="rgba(0, 224, 255, 0.4)" stroke-width="1" />
    <!-- Cara Derecha (Right) -->
    <polygon points="0,16 55,-16 55,46 0,78" fill="url(#cubeRight)" stroke="rgba(139, 92, 246, 0.4)" stroke-width="1" />

    <!-- Aristas luminosas de renderizado -->
    <line x1="0" y1="16" x2="0" y2="78" stroke="#00e0ff" stroke-width="1.5" />
  </g>

  <!-- BLOQUE SATÉLITE IZQUIERDO (Generación Dinámica de Bloques) -->
  <g transform="translate(145, 175)">
    <polygon points="0,-24 28,-8 0,8 -28,-8" fill="url(#cubeTop)" opacity="0.8" />
    <polygon points="-28,-8 0,8 0,40 -28,24" fill="url(#cubeLeft)" />
    <polygon points="0,8 28,-8 28,24 0,40" fill="url(#cubeRight)" />
    <!-- Línea conectora de despliegue Rojo -->
    <line x1="28" y1="8" x2="65" y2="-5" stroke="#00e0ff" stroke-width="1.2" stroke-dasharray="2 3" opacity="0.7" />
  </g>

  <!-- BLOQUE SATÉLITE DERECHO: Scripting Luau / Código -->
  <g transform="translate(350, 135)">
    <polygon points="0,-22 25,-7 0,8 -25,-7" fill="#8b5cf6" opacity="0.7" />
    <polygon points="-25,-7 0,8 0,35 -25,20" fill="#0f172a" stroke="#8b5cf6" stroke-width="1" />
    <polygon points="0,8 25,-7 25,20 0,35" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="1" />
    <!-- Símbolo de código </> -->
    <text x="0" y="24" fill="#00e0ff" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" text-anchor="middle">&lt;/&gt;</text>
  </g>

  <!-- ESCUDO DE SEGURIDAD INFANTIL (Kid-Safe & COPPA Compliance) -->
  <g transform="translate(130, 95)" filter="url(#softGlowSaiydd)">
    <path d="M 16,0 L 32,6 C 32,20 22,30 16,34 C 10,30 0,20 0,6 Z" 
          fill="rgba(10, 25, 47, 0.85)" 
          stroke="#10b981" 
          stroke-width="1.5" />
    <!-- Checkmark de cumplimiento -->
    <path d="M 10,16 L 14,20 L 22,12" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- ESTRELLA DE GAMIFICACIÓN Y RECOMPENSA (Progreso Educativo) -->
  <g transform="translate(365, 80)" filter="url(#softGlowSaiydd)">
    <polygon points="0,-12 3.5,-3.5 12,0 3.5,3.5 0,12 -3.5,3.5 -12,0 -3.5,-3.5" fill="url(#goldGrad)" />
    <circle cx="0" cy="0" r="2.5" fill="#ffffff" />
  </g>

  <!-- Badge Inferior: ROBLOX STUDIO · EDTECH 3D -->
  <g transform="translate(140, 275)">
    <rect x="0" y="0" width="220" height="26" rx="13" fill="rgba(10, 20, 38, 0.9)" stroke="rgba(0, 224, 255, 0.4)" stroke-width="1" />
    <text x="110" y="17" fill="#00e0ff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="1">ROBLOX STUDIO · EDTECH 3D</text>
  </g>

  <!-- Logotipo tipográfico SAIyDD -->
  <text x="250" y="330" fill="#ffffff" font-family="'Orbitron', sans-serif" font-size="18" font-weight="700" text-anchor="middle" letter-spacing="4">SAIyDD <tspan fill="#00e0ff" font-size="14">1.1</tspan></text>
</svg>
