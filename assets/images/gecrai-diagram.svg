<svg class="proyecto-svg" viewBox="0 0 500 360" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="gecraiGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e0ff" />
      <stop offset="100%" stop-color="#0066ff" />
    </linearGradient>

    <linearGradient id="energyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#00e0ff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <radialGradient id="centerAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e0ff" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#0066ff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <circle cx="250" cy="180" r="160" fill="url(#centerAura)" />

  <g stroke="rgba(0, 224, 255, 0.15)" stroke-width="1.5" fill="none">
    <path d="M 60,80 L 140,80 L 180,120 L 180,240 L 140,280 L 60,280" />
    <path d="M 440,80 L 360,80 L 320,120 L 320,240 L 360,280 L 440,280" />
    <path d="M 140,80 L 140,40 M 360,80 L 360,40" />
    <path d="M 140,280 L 140,320 M 360,280 L 360,320" />
    <circle cx="140" cy="40" r="3" fill="#00e0ff" />
    <circle cx="360" cy="40" r="3" fill="#00e0ff" />
    <circle cx="140" cy="320" r="3" fill="#00e0ff" />
    <circle cx="360" cy="320" r="3" fill="#00e0ff" />
  </g>

  <circle cx="250" cy="170" r="110" fill="none" stroke="rgba(0, 224, 255, 0.2)" stroke-width="2" />
  <circle cx="250" cy="170" r="98" fill="none" stroke="#00e0ff" stroke-width="2" stroke-dasharray="6 8" opacity="0.6" />
  <circle cx="250" cy="170" r="82" fill="none" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.5" stroke-dasharray="14 10" />

  <rect x="180" y="95" width="140" height="150" rx="12" fill="#0a0f1c" stroke="url(#primaryGrad)" stroke-width="2" filter="url(#softGlow)" />
  
  <line x1="195" y1="120" x2="305" y2="120" stroke="rgba(0, 224, 255, 0.3)" stroke-width="1.5" />
  <circle cx="196" cy="108" r="3" fill="#ef4444" />
  <circle cx="206" cy="108" r="3" fill="#f59e0b" />
  <circle cx="216" cy="108" r="3" fill="#10b981" />

  <path d="M 256,128 L 234,168 L 250,168 L 240,210 L 268,162 L 252,162 Z" 
        fill="url(#energyGrad)" 
        stroke="#ffffff" 
        stroke-width="1" 
        filter="url(#gecraiGlow)" />

  <circle cx="205" cy="180" r="4" fill="#00e0ff" filter="url(#softGlow)" />
  <circle cx="295" cy="180" r="4" fill="#10b981" filter="url(#softGlow)" />
  <line x1="209" y1="180" x2="225" y2="180" stroke="#00e0ff" stroke-width="1" stroke-dasharray="2 2" />
  <line x1="275" y1="180" x2="291" y2="180" stroke="#10b981" stroke-width="1" stroke-dasharray="2 2" />

  <g transform="translate(160, 275)">
    <rect x="0" y="0" width="180" height="26" rx="13" fill="rgba(10, 20, 38, 0.9)" stroke="rgba(0, 224, 255, 0.4)" stroke-width="1" />
    <text x="90" y="17" fill="#00e0ff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="1">NOM-001 · IEEE 1584</text>
  </g>

  <text x="250" y="330" fill="#ffffff" font-family="'Orbitron', sans-serif" font-size="18" font-weight="700" text-anchor="middle" letter-spacing="4">GECRAI <tspan fill="#00e0ff" font-size="14">1.1</tspan></text>
</svg>
